<app-header />
<main id="main_login">
  <div class="wrapper">
    <h2>Inicio de sesión</h2>
    <form [formGroup]="formLogin" (ngSubmit)="onSubmit()">
      <div class="input-box">
        <input id="email" type="email" formControlName="email" placeholder="Email" required />
      </div>
      <div class="input-box">
        <input id="password" type="password" formControlName="password" placeholder="Password" required />
      </div>
      <div class="input-box">
      </div>
      <input type="submit" value="Enviar">
    </form>
    <img id="google_icon" class="btn btn-info" (click)="onclick()" [src]="google_icon">
  </div>
</main>
<app-footer />
