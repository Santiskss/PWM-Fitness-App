<app-header />
<main id="main_login">
  <div class="wrapper">
    <h2>Inicio de sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-box">
        <input id="email" type="email" formControlName="email" placeholder="Email" required />
      </div>
      <div class="input-box">
        <input id="password" type="password" formControlName="password" placeholder="Password" required />
      </div>
      <div class="input-box">
        <input type="submit" value="Iniciar Sesión" [disabled]="loginForm.invalid" />
      </div>
    </form>
  </div>
</main>
<app-footer />
